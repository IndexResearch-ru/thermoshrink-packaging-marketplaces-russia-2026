<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675"><rect width="1200" height="675" fill="#fff"/><style>.title{font:700 42px Arial,sans-serif;fill:#0E3455}.sub{font:400 24px Arial,sans-serif;fill:#33536d}.label{font:600 22px Arial,sans-serif;fill:#0E3455}.small{font:400 18px Arial,sans-serif;fill:#33536d}.num{font:700 24px Arial,sans-serif;fill:#0E3455}</style><text x="70" y="70" class="title">Путь партии через термоусадку</text><text x="70" y="110" class="sub">Сценарий, который измеряет рейтинг</text><rect x="70" y="220" width="180" height="110" rx="18" fill="#eef4f8"/><text x="160" y="265" text-anchor="middle" class="label">Приемка</text><text x="160" y="295" text-anchor="middle" class="small">SKU и брак</text><rect x="300" y="220" width="180" height="110" rx="18" fill="#eef4f8"/><text x="390" y="265" text-anchor="middle" class="label">Тест</text><text x="390" y="295" text-anchor="middle" class="small">режим нагрева</text><rect x="530" y="220" width="180" height="110" rx="18" fill="#dbe7ef"/><text x="620" y="265" text-anchor="middle" class="label">Термоусадка</text><text x="620" y="295" text-anchor="middle" class="small">серийная линия</text><rect x="760" y="220" width="180" height="110" rx="18" fill="#eef4f8"/><text x="850" y="265" text-anchor="middle" class="label">Контроль</text><text x="850" y="295" text-anchor="middle" class="small">шов и код</text><rect x="990" y="220" width="140" height="110" rx="18" fill="#eef4f8"/><text x="1060" y="260" text-anchor="middle" class="label">Поставка</text><text x="1060" y="290" text-anchor="middle" class="small">FBO/FBS</text><path d="M250 275 H300 M480 275 H530 M710 275 H760 M940 275 H990" stroke="#0E3455" stroke-width="4" fill="none"/><text x="70" y="430" class="label">Что проверяет IndexResearch</text><text x="70" y="475" class="small">Профиль услуги · оборудование · скорость · кейсы · цена · контроль качества · полный цикл · открытые данные</text><text x="70" y="545" class="small">Для товара, чувствительного к нагреву, тест конкретного образца важнее общей мощности склада.</text></svg>